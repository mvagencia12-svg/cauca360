<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a1420; --panel:#111f2e; --panel2:#18293a; --line:#22384d;
  --text:#e8eef4; --dim:#7b93a8; --faint:#4a6076;
  --accent:#f4622e; --accent2:#e04a1f; --blue:#3b82f6;
}
body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text);min-height:100vh;display:flex;justify-content:center;
padding:calc(env(safe-area-inset-top) + 1rem) .875rem calc(env(safe-area-inset-bottom) + 2.5rem);
-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.app{width:100%;max-width:520px;display:flex;flex-direction:column;gap:.875rem}

.header{display:flex;align-items:center;gap:.75rem;padding:.25rem 0 .5rem}
.header img{width:44px;height:44px;border-radius:10px;flex-shrink:0}
.header h1{font-size:15px;font-weight:700;letter-spacing:-.01em}
.header p{font-size:11px;color:var(--faint);margin-top:1px}

.card{background:var(--panel);border-radius:14px;border:1px solid var(--line);overflow:hidden}
.section{padding:1rem;border-bottom:1px solid var(--line)}
.section:last-child{border-bottom:none}
.slabel{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);margin-bottom:.625rem;display:flex;justify-content:space-between;align-items:baseline}
.counter{font-size:10px;color:var(--faint);font-weight:400;letter-spacing:0;text-transform:none}

textarea{width:100%;padding:.75rem;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:16px;font-family:inherit;line-height:1.55;resize:vertical;outline:none;transition:border-color .15s}
textarea:focus{border-color:var(--accent)}
textarea::placeholder{color:var(--faint)}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.seg label{position:relative}
.seg input{display:none}
.seg .in{cursor:pointer;padding:.75rem .5rem;background:var(--panel2);border:1.5px solid var(--line);border-radius:10px;text-align:center;transition:all .15s;display:flex;flex-direction:column;gap:3px}
.seg input:checked + .in{background:rgba(244,98,46,.13);border-color:var(--accent)}
.seg .t{font-size:14px;font-weight:600;color:var(--dim);transition:color .15s}
.seg input:checked + .in .t{color:var(--accent)}
.seg .d{font-size:10px;color:var(--faint);line-height:1.3}

.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:.375rem}
.chip{position:relative}
.chip input{display:none}
.chip .in{cursor:pointer;padding:.625rem .25rem;background:var(--panel2);border:1.5px solid var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:4px;transition:all .15s}
.chip input:checked + .in{background:rgba(244,98,46,.13);border-color:var(--accent)}
.chip svg{width:17px;height:17px;color:var(--faint);transition:color .15s}
.chip input:checked + .in svg{color:var(--accent)}
.chip .n{font-size:10px;color:var(--faint);font-weight:500;transition:color .15s}
.chip input:checked + .in .n{color:var(--text)}

.opt{display:flex;align-items:center;gap:.625rem;padding:.625rem .75rem;background:var(--panel2);border-radius:10px;border:1px solid var(--line);cursor:pointer;margin-bottom:.375rem}
.opt:last-child{margin-bottom:0}
.opt input{display:none}
.cb{width:20px;height:20px;background:var(--bg);border:1.5px solid var(--faint);border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.cb svg{display:none;width:12px;height:12px}
.opt input:checked ~ .cb{background:var(--accent);border-color:var(--accent)}
.opt input:checked ~ .cb svg{display:block}
.opt .lbl{font-size:13px;color:var(--text)}
.opt .sub{display:block;font-size:10px;color:var(--faint);margin-top:1px}

.go{width:100%;background:var(--accent);color:#fff;font-weight:700;font-size:15px;padding:1rem;border-radius:13px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.625rem;transition:background .15s,transform .1s;font-family:inherit}
.go:hover{background:var(--accent2)}
.go:active{transform:scale(.985)}
.go:disabled{opacity:.55;cursor:not-allowed}

.ghost{width:100%;background:var(--panel);color:var(--text);font-weight:600;font-size:14px;padding:.8rem;border-radius:13px;border:1px solid var(--line);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.5rem;font-family:inherit;transition:background .15s}
.ghost:hover{background:var(--panel2)}
.link{width:100%;background:none;color:var(--faint);font-size:13px;padding:.4rem;border:none;cursor:pointer;font-family:inherit;transition:color .15s}
.link:hover{color:var(--dim)}

@keyframes spin{to{transform:rotate(360deg)}}
.sp{border:2.5px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;width:16px;height:16px;animation:spin .7s linear infinite;display:none}
.sp.on{display:inline-block}

.err{display:none;padding:.875rem;background:#2a0f0f;border:1px solid #7f1d1d;border-radius:11px;color:#fca5a5;font-size:13px;text-align:center}
.err.on{display:block}
.warn{padding:.7rem .875rem;background:#241c0d;border-left:3px solid #d97706;border-radius:9px;color:#d6c9a8;font-size:11.5px;margin-bottom:.25rem}

.post{display:none;flex-direction:column;gap:.625rem}
.post.on{display:flex}

@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.res{background:var(--panel);border-radius:14px;border:1px solid var(--line);overflow:hidden;animation:fade .25s ease;margin-bottom:.75rem}
.rhead{display:flex;align-items:center;justify-content:space-between;padding:.625rem .875rem;border-bottom:1px solid var(--line)}
.badge{display:flex;align-items:center;gap:.375rem;font-size:12px;font-weight:600;color:var(--dim)}
.badge svg{width:13px;height:13px}
.chars{font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums}
.chars.over{color:#f87171}

.arte{margin:.875rem .875rem 0;background:linear-gradient(135deg,rgba(244,98,46,.16),rgba(244,98,46,.05));border:1px solid rgba(244,98,46,.4);border-radius:11px;padding:.75rem .875rem;position:relative}
.arte .k{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin-bottom:.3rem}
.arte .v{color:#fff;font-weight:800;font-size:16px;line-height:1.25}
.mini{position:absolute;top:.6rem;right:.6rem;background:rgba(10,20,32,.7);border:none;color:var(--accent);font-size:10px;font-weight:600;padding:3px 8px;border-radius:6px;cursor:pointer;font-family:inherit}
.mini.ok{background:#14532d;color:#86efac}

.body{padding:.875rem}
.tit{color:#fff;font-weight:700;font-size:15.5px;line-height:1.3;margin-bottom:.6rem}
.dev{color:#c8d6e2;font-size:13.5px;line-height:1.65;white-space:pre-wrap;margin-bottom:.6rem}
.tags{color:var(--accent);font-size:12.5px;font-weight:500}
.edit{width:100%;background:var(--panel2);border:1px solid var(--accent);border-radius:9px;color:var(--text);font-size:14px;font-family:inherit;line-height:1.6;padding:.7rem;resize:vertical;outline:none;min-height:150px}

.extra{padding:0 .875rem .75rem}
.ek{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);margin-bottom:.4rem}
.alts{background:var(--panel2);border-radius:10px;padding:.15rem .8rem;list-style:none}
.alts li{padding:.5rem 0;border-bottom:1px solid var(--line);color:#c8d6e2;font-size:13px;line-height:1.4;cursor:pointer;transition:color .15s}
.alts li:last-child{border-bottom:none}
.alts li:hover{color:#fff}
.alts li::after{content:'copiar';float:right;font-size:9px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin-left:.5rem}
.alts li.ok::after{content:'copiado';color:#86efac}

.acts{display:flex;gap:.5rem;padding:0 .875rem .875rem}
.act{flex:1;background:var(--panel2);color:var(--dim);font-size:12.5px;font-weight:600;padding:.6rem;border-radius:9px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.4rem;font-family:inherit;transition:all .15s}
.act:hover{background:var(--line);color:#fff}
.act.ok{background:#14532d;color:#86efac}
.act svg{width:13px;height:13px}
.hidden{display:none!important}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
</style>
</head>

MÉTODO DE TRABAJO CON EL TEXTO DE ENTRADA

El texto que recibes puede venir de otro medio, ser corto o largo, y traer emojis o formato ajeno.

  Párrafo: "Tres personas fueron asesinadas mientras se movilizaban en bicicleta..."

UBICACIÓN:
Debe quedar clara desde la primera línea, integrada en la redacción.
SI LA NOTICIA ES NACIONAL O MUNDIAL: no puedes entregarla sin aterrizarla en el Cauca.

async function call(sys, usr, ctx){
  const body = { model:'claude-sonnet-4-5', max_tokens: ctx?6000:4000, system:sys, messages:[{role:'user',content:usr}] };
  if(ctx) body.tools = [{ type:'web_search_20250305', name:'web_search', max_uses:3 }];
  const r = await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  if(!r.ok){ const e = await r.json().catch(()=>({})); throw new Error(e.error?.message || `Error ${r.status}`); }
  const d = await r.json();
  const raw = d.content.filter(b=>b.type==='text').map(b=>b.text||'').join('');
  const m = raw.match(/\{[\s\S]*\}/);
  if(!m) throw new Error('Respuesta sin JSON válido.');
  return JSON.parse(m[0]);
}

const LIMITS = { facebook: 0, instagram: 2200, tiktok: 2200, x: 280 };

function copy(text, done){
  if(!text) return;
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(()=>fb(text,done));
  } else fb(text,done);
}
function fb(text, done){
  const t = document.createElement('textarea');
  t.value = text; t.setAttribute('readonly','');
  t.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
  document.body.appendChild(t); t.select(); t.setSelectionRange(0, text.length);
  try{ document.execCommand('copy'); done(); }catch(e){ alert('No se pudo copiar.'); }
  document.body.removeChild(t);
}
function flash(btn, txt){
  const o = btn.innerHTML; btn.innerHTML = txt; btn.classList.add('ok');
  setTimeout(()=>{ btn.innerHTML = o; btn.classList.remove('ok'); }, 1800);
}

function render(data, alt){
  el.res.innerHTML = '';
  if(data.aviso){
    const w = document.createElement('div');
    w.className = 'warn'; w.textContent = data.aviso;
    el.res.appendChild(w);
  }
  Object.keys(data).forEach(net => {
    if(net === 'aviso') return;
    const it = data[net];
    if(!it || typeof it !== 'object') return;

    const tags = Array.isArray(it.hashtags) ? it.hashtags.join(' ') : (it.hashtags||'');
    let full = `${it.titulo}\n\n${it.desarrollo}\n\n${tags}`.trim();

    const card = document.createElement('div');
    card.className = 'res';

    const lim = LIMITS[net] || 0;
    const over = lim && full.length > lim;

    let altsHtml = '';
    if(alt && Array.isArray(it.alternativos)){
      altsHtml = `<div class="extra"><div class="ek">Titulares alternativos</div>
        <ul class="alts">${it.alternativos.map(t=>`<li data-t="${String(t).replace(/"/g,'&quot;')}">${t}</li>`).join('')}</ul></div>`;
    }

    card.innerHTML = `
      <div class="rhead">
        <span class="badge">${ICONS[net]||''} ${net.charAt(0).toUpperCase()+net.slice(1)}</span>
        <span class="chars${over?' over':''}" data-chars>${full.length}${lim?' / '+lim:''}</span>
      </div>
      ${it.texto_arte?`<div class="arte">
        <button class="mini" data-arte>Copiar</button>
        <div class="k">Texto para el arte</div>
        <div class="v">${it.texto_arte}</div>
      </div>`:''}
      <div class="body">
        <div class="tit">${it.titulo}</div>
        <div class="dev" data-dev>${it.desarrollo}</div>
        <div class="tags">${tags}</div>
        <textarea class="edit hidden" data-edit></textarea>
      </div>
      ${altsHtml}
      <div class="acts">
        <button class="act" data-editbtn>
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.4-9.4a2 2 0 112.8 2.8L12 15l-4 1 1-4 8.6-8.6z"/></svg>
          Editar
        </button>
        <button class="act" data-copybtn>
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          Copiar
        </button>
      </div>`;

    const dev = card.querySelector('[data-dev]');
    const ta = card.querySelector('[data-edit]');
    const chars = card.querySelector('[data-chars]');
    const editBtn = card.querySelector('[data-editbtn]');

    editBtn.addEventListener('click', ()=>{
      if(ta.classList.contains('hidden')){
        ta.value = full;
        ta.classList.remove('hidden'); dev.classList.add('hidden');
        card.querySelector('.tit').classList.add('hidden');
        card.querySelector('.tags').classList.add('hidden');
        ta.style.height = ta.scrollHeight + 'px';
        ta.focus();
        editBtn.innerHTML = 'Listo';
      } else {
        full = ta.value;
        ta.classList.add('hidden'); dev.classList.remove('hidden');
        dev.textContent = full;
        editBtn.innerHTML = 'Editar';
      }
    });
    ta.addEventListener('input', ()=>{
      full = ta.value;
      chars.textContent = full.length + (lim?' / '+lim:'');
      chars.classList.toggle('over', lim && full.length > lim);
      ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px';
    });

    const cb = card.querySelector('[data-copybtn]');
    cb.addEventListener('click', ()=> copy(full, ()=>flash(cb,'Copiado')));

    const ab = card.querySelector('[data-arte]');
    if(ab) ab.addEventListener('click', ()=> copy(it.texto_arte, ()=>flash(ab,'Copiado')));

    card.querySelectorAll('.alts li').forEach(li=>{
      li.addEventListener('click', ()=>{
        copy(li.dataset.t, ()=>{ li.classList.add('ok'); setTimeout(()=>li.classList.remove('ok'),1600); });
      });
    });

    el.res.appendChild(card);
  });
}

async function run(p, btn, txtEl, spEl, label){
  el.err.classList.remove('on'); el.res.innerHTML = ''; el.post.classList.remove('on');
  btn.disabled = true; spEl.classList.add('on');
  txtEl.textContent = p.ctx ? 'Buscando...' : 'Generando...';
  try{
    const data = await call(buildSystem(p.cta, p.alt, p.ctx), buildUser(p.topic, p.nets), p.ctx);
    render(data, p.alt);
    el.post.classList.add('on');
  }catch(e){
    el.err.textContent = e.message; el.err.classList.add('on');
    if(last) el.post.classList.add('on');
  }finally{
    btn.disabled = false; spEl.classList.remove('on'); txtEl.textContent = label;
  }
}

el.go.addEventListener('click', ()=>{
  const topic = el.topic.value.trim();
  if(!topic){ el.topic.style.borderColor='#ef4444'; setTimeout(()=>el.topic.style.borderColor='',1800); el.topic.focus(); return; }
  const nets = NETS.filter(n=>$('ch-'+n).checked);
  if(!nets.length){ alert('Selecciona al menos un canal.'); return; }
  last = { topic, nets, cta: document.querySelector('input[name="cta"]:checked').value, alt: el.alt.checked, ctx: el.ctx.checked };
  run(last, el.go, el.goText, el.sp, 'Generar');
});

el.again.addEventListener('click', ()=>{ if(last) run(last, el.again, el.againText, el.sp2, 'Otra versión'); });

el.clear.addEventListener('click', ()=>{
  el.res.innerHTML=''; el.topic.value=''; el.inCount.textContent='';
  el.err.classList.remove('on'); el.post.classList.remove('on'); last=null; el.topic.focus();
});
